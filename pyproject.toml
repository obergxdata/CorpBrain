[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corpbrain"
version = "0.1.0"
description = "Corporate simulation agents"
requires-python = ">=3.11"
dependencies = ["matplotlib", "pydantic"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["agents"]

[tool.setuptools.packages.find]
include = ["stats*", "charts*", "agents*"]
